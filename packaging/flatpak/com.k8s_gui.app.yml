# A Flatpak built from the AppImage this release already produces.
#
# Why this exists: on RHEL 8 and its rebuilds — AlmaLinux 8, Rocky 8 — none of
# the other Linux artifacts can run, and not for a packaging reason.
#
#   * the .rpm and .deb require `libwebkit2gtk-4.1.so.0`; RHEL 8 ships
#     `webkit2gtk3`, which provides `libwebkit2gtk-4.0.so.37`, and there is no
#     4.1 package for it at all;
#   * the AppImage bundles webkit 4.1, but the binary needs `GLIBC_2.39` and
#     RHEL 8 has 2.28. An AppImage does not carry a libc.
#
# The GNOME runtime carries both: a glibc new enough, and WebKitGTK 4.1 built
# against the runtime's own GTK, glib and Mesa. Only the binary comes from the
# AppImage.
#
# Not the AppImage's libraries. Up to 4.19.0 this bundle ran on the bare
# freedesktop runtime and copied the AppImage's whole usr/lib into /app/lib —
# Ubuntu 22.04's WebKit, GTK, glib, cairo, epoxy, gstreamer, ssl and ~90
# more, each shadowing the runtime's own copy. WebKit's web process then met
# the runtime's Mesa through Ubuntu's libraries and aborted on "Could not
# create default EGL display: EGL_BAD_PARAMETER", and every launch was a white
# window. No environment variable changed that; CI tried five.
#
# This is a **bundle**, published as a release asset, not a Flathub
# submission. Flathub forbids prebuilt binaries and builds offline, which is
# where a bun project runs out of road; none of that applies to a bundle the
# reader installs with `flatpak install ./Rubick.flatpak`.
app-id: com.k8s_gui.app
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: Rubick
separate-locales: false
finish-args:
  - --share=network
  - --share=ipc
  # x11, because GDK_BACKEND below forces it: the Wayland backend crashes
  # (tauri-apps/tauri#8541).
  - --socket=x11
  - --device=dri
  # The kubeconfig, the caches, and the helpers under $HOME: krew, asdf,
  # ~/.local/bin. The ones in /usr/bin need host-os below.
  - --filesystem=home
  # A sandbox's /usr is the runtime's, so an EKS context whose exec block
  # names /usr/local/bin/aws cannot connect at all. This puts the host tree
  # under /run/host, where the path resolver now looks.
  - --filesystem=host-os:ro
  - --talk-name=org.freedesktop.secrets
  # notify-rust talks to this name directly, not through the portal, and a
  # denied call is swallowed: notify() reports delivered for nothing shown.
  - --talk-name=org.freedesktop.Notifications
  # single-instance asks to own tauri.conf.json's hyphenated identifier plus
  # .SingleInstance, which this app-id does not prefix; the refusal is
  # swallowed, and every rubick:// link then opens a second window.
  - --own-name=com.k8s-gui.app.SingleInstance
  - --env=GDK_BACKEND=x11
modules:
  - name: rubick
    buildsystem: simple
    build-commands:
      - install -Dm755 squashfs-root/usr/bin/Rubick /app/bin/Rubick
      # What the runtime does not have, and nothing else — asked of the
      # linker rather than listed by hand, so a dependency the next Tauri
      # adds is found the same way. A library the runtime *does* have is
      # never copied: a second, older copy first on the path is exactly how
      # the white window happened.
      - |
        mkdir -p /app/lib
        for pass in 1 2 3 4 5 6; do
          missing=$(LD_LIBRARY_PATH=/app/lib ldd /app/bin/Rubick /app/lib/*.so* 2>/dev/null \
            | awk '/=> not found/ { print $1 }' | sort -u)
          [ -z "$missing" ] && break
          for lib in $missing; do
            src=$(find squashfs-root/usr/lib -name "$lib" | head -n 1)
            if [ -z "$src" ]; then
              echo "neither the runtime nor the AppImage has $lib" >&2
              exit 1
            fi
            echo "taking $lib from the AppImage"
            cp -L "$src" /app/lib/
          done
        done
        if LD_LIBRARY_PATH=/app/lib ldd /app/bin/Rubick | grep -q "not found"; then
          echo "still unresolved after the AppImage's libraries" >&2
          exit 1
        fi
        # The stack that has to be the runtime's own. Taking any of it from
        # the AppImage — because a runtime version lacks WebKit 4.1, say —
        # rebuilds the white window in miniature, so it stops the build.
        for f in /app/lib/*; do
          case "$(basename "$f")" in
            libwebkit2gtk*|libjavascriptcoregtk*|libgtk-3*|libgdk-3*|libglib-2*|libgio-2*|libgobject-2*|libsoup-3*|libepoxy*|libEGL*|libGL*|libgbm*|libdrm*|libwayland-*|libcairo*|libpango*)
              echo "the runtime lacks $(basename "$f"); refusing the AppImage's copy" >&2
              exit 1 ;;
          esac
        done
        ls -la /app/lib
      - install -Dm644 squashfs-root/usr/share/applications/Rubick.desktop /app/share/applications/com.k8s_gui.app.desktop
      - desktop-file-edit --set-key=Icon --set-value=com.k8s_gui.app /app/share/applications/com.k8s_gui.app.desktop
      # Exec decides what the exported launcher runs: flatpak turns its first
      # word into `--command=`. `%u` is how a `rubick://` link is handed over;
      # the desktop file declares the scheme and passed nothing.
      - desktop-file-edit --set-key=Exec --set-value='Rubick %u' /app/share/applications/com.k8s_gui.app.desktop
      # The three sizes the AppImage carries, named as hicolor names them.
      # No `if -f`: an icon that stopped shipping must break the build.
      - for d in 32x32 128x128 256x256@2; do install -Dm644 "squashfs-root/usr/share/icons/hicolor/$d/apps/Rubick.png" "/app/share/icons/hicolor/$d/apps/com.k8s_gui.app.png"; done
    sources:
      - type: dir
        path: squashfs-root
        dest: squashfs-root

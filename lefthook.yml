# Lefthook git hooks. Install once after `bun install`:
#
#     bunx lefthook install
#
# Skip a single commit's hooks with `LEFTHOOK=0 git commit ...`.
#
# ## Nothing on pre-push, deliberately
#
# There was a pre-push hook and it ran the whole frontend suite — thirty
# seconds on every push, which is long enough to time out a tool driving git
# on your behalf and leave a commit made and unpushed.
#
# It is gone rather than trimmed because CI already runs a strict superset:
# `cargo test` without `--lib` (so the bin compiles), `cargo clippy
# --all-targets`, `cargo fmt --check`, `bun run build`, `tsc --noEmit`,
# `bun run test` and `bun run lint`. The one thing the hook was written to
# catch — the v2.1.0 release, where 90 `__cmd__X not found` errors compiled
# clean under `cargo test --lib` because the *binary* was never built — is
# caught twice over there, by the un-suffixed `cargo test` and by clippy's
# `--all-targets`.
#
# So the hook was buying a slower push and no coverage. What it did buy was
# finding out before the push rather than after, and that is now yours to do:
# run `bun run test` before you push something you care about landing green.

pre-commit:
  parallel: true
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
    eslint:
      glob: "*.{ts,tsx}"
      # Lint reports many warnings post-react-hooks@7 upgrade — allow them
      # for now, fail only on errors. Tighten by removing this once the
      # warnings backlog is triaged.
      run: bunx eslint {staged_files}
    prettier:
      glob: "*.{ts,tsx,css,json,md}"
      run: bunx prettier --check {staged_files}

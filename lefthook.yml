# Lefthook git hooks. Install once after `bun install`:
#
#     bunx lefthook install
#
# Skip a single commit's hooks with `LEFTHOOK=0 git commit ...`.

pre-commit:
  parallel: true
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    eslint:
      glob: "*.{ts,tsx}"
      run: bunx eslint --max-warnings 0 {staged_files}
    prettier:
      glob: "*.{ts,tsx,css,json,md}"
      run: bunx prettier --check {staged_files}

pre-push:
  parallel: true
  commands:
    # TWO things make this hook skip silently, and it has done both.
    #
    # 1. `glob:` is REQUIRED on each command — lefthook's pre-push default
    #    is "skip if no matching files" and without a glob it treats the
    #    implicit filter as empty. This is what masked the v2.1.0 release:
    #    90 `__cmd__X not found` errors compiled clean in `cargo test
    #    --lib` but the bin build was never run pre-push.
    #
    # 2. The branch MUST track a remote. Lefthook builds the file list
    #    with `git diff --name-only HEAD @{push}`; with no upstream that
    #    errors and it falls back to `git diff HEAD <branch>` — the
    #    branch against itself — so the list is empty and every command
    #    below skips no matter what you are pushing. Check it with
    #    `git rev-parse --abbrev-ref main@{upstream}`; fix it with
    #    `git branch --set-upstream-to=origin/main main`. A fresh clone
    #    gets this from `git clone`; a repo re-created or re-pointed by
    #    hand does not, and then the whole gate is off with no output
    #    beyond "(skip) no matching push files".
    frontend-tests:
      glob: "*.{ts,tsx}"
      run: bun run test
    rust-tests:
      glob: "*.rs"
      run: cargo test --workspace --lib
    # Catches `tauri::generate_handler!` macro expansion failures
    # (the v2.1.0 release CI failure) and any other bin-only compile
    # error. `cargo check` skips codegen + linking — ~3 s warm,
    # ~30-50 s after dependency invalidation. Far cheaper than full
    # `cargo test` of the bin.
    rust-check-bin:
      glob: "*.rs"
      run: cargo check --manifest-path src-tauri/Cargo.toml --bin k8s-gui

# What the app used to refuse to read: a log line that is not UTF-8, and a
# pod whose name has a dot in it, as a static pod named after its node has.
#
#     kubectl apply -f test-manifests/odd-bytes-and-names.yaml
#     cargo test --test live live_reads:: -- --ignored --nocapture
#     kubectl delete -f test-manifests/odd-bytes-and-names.yaml
apiVersion: v1
kind: Pod
metadata:
  name: bad-bytes
  namespace: k8s-gui-test
spec:
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "printf 'ok\\n\\377\\376\\nafter\\n'; sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: web.v1
  namespace: k8s-gui-test
spec:
  containers:
    - name: main
      image: busybox:1.36
      command: ["sleep", "3600"]

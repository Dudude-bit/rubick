# The shape reported from a live Netbird cluster, where every TCPRoute read
# "the route is invisible to the data plane" while carrying traffic. Netbird
# is not needed to reproduce it — what matters is: a claimed class, a
# programmed Gateway with no published address, and a route the controller
# wrote no status for.
#
#   kind create cluster --name rubick-gw
#   kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/experimental-install.yaml
#   kubectl apply -f test-manifests/no-route-status.yaml
#   ./test-manifests/no-route-status-play-controller.sh
#   K8S_GUI_SHAPE_CONTEXT=kind-rubick-gw \
#     cargo test --test live_route_status -- --ignored --nocapture
#
# TCPRoute lives in the experimental channel, not standard-install.
#
apiVersion: v1
kind: Namespace
metadata: { name: netbird }
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: { name: netbird-private }
spec:
  controllerName: gateway.netbird.io/controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: private, namespace: netbird }
spec:
  gatewayClassName: netbird-private
  listeners:
    - name: tcp
      port: 443
      protocol: TCP
      allowedRoutes:
        namespaces: { from: All }
        kinds: [{ kind: TCPRoute }]
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata: { name: kubernetes, namespace: default }
spec:
  parentRefs:
    - name: private
      namespace: netbird
      sectionName: tcp
  rules:
    - backendRefs:
        - name: kubernetes
          port: 443

# Test resources for k8s-gui UI coverage.
# Apply CRDs first: `kubectl apply -f test-manifests/k8s-gui-crds.yaml`.
# Minikube setup: `minikube addons enable ingress` and `minikube addons enable metrics-server`.
# Some documents (CRD/PV/StorageClass) require cluster-admin privileges.
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-gui-test
  labels:
    app.kubernetes.io/part-of: k8s-gui-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-gui-test
  namespace: k8s-gui-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
  namespace: k8s-gui-test
data:
  app.conf: |
    message=hello-from-configmap
  info.json: |
    {"level":"info","msg":"from configmap","source":"demo-config"}
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
  namespace: k8s-gui-test
type: Opaque
stringData:
  username: demo-user
  password: demo-pass
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-reader
  namespace: k8s-gui-test
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-reader-binding
  namespace: k8s-gui-test
subjects:
  - kind: ServiceAccount
    name: k8s-gui-test
    namespace: k8s-gui-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-demo
  namespace: k8s-gui-test
  labels:
    app: log-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-demo
  template:
    metadata:
      labels:
        app: log-demo
    spec:
      serviceAccountName: k8s-gui-test
      containers:
        - name: json-logger
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              i=0
              while true; do
                echo "{\"level\":\"info\",\"msg\":\"json log\",\"request_id\":\"req-$i\",\"user\":\"alice\"}"
                i=$((i+1))
                sleep 2
              done
          env:
            - name: DEMO_ENV
              value: json-logger
          envFrom:
            - configMapRef:
                name: demo-config
        - name: logfmt-logger
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              i=0
              while true; do
                echo "level=warn msg=\"logfmt log\" user=bob request_id=req-$i"
                i=$((i+1))
                sleep 3
              done
        - name: klog-logger
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              i=0
              while true; do
                echo "I0102 03:04:05.678901 1 main.go:12] klog message $i"
                i=$((i+1))
                sleep 4
              done
        - name: logback-logger
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              i=0
              while true; do
                echo "2025-01-02 03:04:05,678 INFO [main] com.example.App - logback message $i"
                i=$((i+1))
                sleep 5
              done
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: log-demo
  namespace: k8s-gui-test
spec:
  type: ClusterIP
  selector:
    app: log-demo
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: log-demo
  namespace: k8s-gui-test
spec:
  ingressClassName: nginx
  rules:
    - host: log-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-demo
                port:
                  number: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: shell-demo
  namespace: k8s-gui-test
  labels:
    app: shell-demo
spec:
  containers:
    - name: shell
      image: alpine:3.20
      command: ["sh", "-c", "sleep 3600"]
      tty: true
      stdin: true
      volumeMounts:
        - name: demo-volume
          mountPath: /data
  volumes:
    - name: demo-volume
      persistentVolumeClaim:
        claimName: pvc-demo
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-demo
  namespace: k8s-gui-test
spec:
  template:
    metadata:
      labels:
        app: job-demo
    spec:
      restartPolicy: Never
      containers:
        - name: job
          image: busybox:1.36
          command: ["sh", "-c", "echo job-start && sleep 10 && echo job-done"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-demo
  namespace: k8s-gui-test
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: cron
              image: busybox:1.36
              command: ["sh", "-c", "date && echo cron-run"]
---
apiVersion: v1
kind: Service
metadata:
  name: stateful-demo
  namespace: k8s-gui-test
spec:
  clusterIP: None
  selector:
    app: stateful-demo
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-demo
  namespace: k8s-gui-test
spec:
  serviceName: stateful-demo
  replicas: 1
  selector:
    matchLabels:
      app: stateful-demo
  template:
    metadata:
      labels:
        app: stateful-demo
    spec:
      containers:
        - name: stateful
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daemon-demo
  namespace: k8s-gui-test
spec:
  selector:
    matchLabels:
      app: daemon-demo
  template:
    metadata:
      labels:
        app: daemon-demo
    spec:
      containers:
        - name: daemon
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo daemon-demo; sleep 30; done"]
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: k8s-gui-hostpath
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-demo
spec:
  capacity:
    storage: 2Gi
  accessModes: ["ReadWriteOnce"]
  storageClassName: k8s-gui-hostpath
  persistentVolumeReclaimPolicy: Delete
  hostPath:
    path: /tmp/k8s-gui-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-manual
  namespace: k8s-gui-test
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: k8s-gui-hostpath
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-demo
  namespace: k8s-gui-test
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: demo.k8s-gui.io/v1
kind: Widget
metadata:
  name: widget-demo
  namespace: k8s-gui-test
spec:
  tier: gold
  size: 3
  description: "Widget for k8s-gui CRD testing"
status:
  ready: "true"
---
# Init:CrashLoopBackOff. `wait-for-db` succeeds, `migrate` fails on its
# second line, `seed` never gets a turn, and `app` never starts — the
# specimen for reading an init container's log, and for the previous
# run that holds the error.
apiVersion: v1
kind: Pod
metadata:
  name: init-demo
  namespace: k8s-gui-test
  labels:
    app: init-demo
spec:
  initContainers:
    - name: wait-for-db
      image: busybox:1.36
      command: ["sh", "-c", "echo checking db; sleep 3; echo db is up"]
    - name: migrate
      image: busybox:1.36
      command:
        - sh
        - -c
        - >-
          echo applying 014_add_index.sql;
          echo applying 015_backfill.sql;
          echo 'ERROR: relation "orders" does not exist' >&2;
          echo migration failed, exiting 1;
          exit 1
    - name: seed
      image: busybox:1.36
      command: ["sh", "-c", "echo seeding; sleep 2"]
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo app tick; sleep 5; done"]
---
# `proxy` is an init container with `restartPolicy: Always`: it starts
# during init and never finishes, so it is neither an init step nor an
# app container.
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
  namespace: k8s-gui-test
  labels:
    app: sidecar-demo
spec:
  initContainers:
    - name: prepare
      image: busybox:1.36
      command: ["sh", "-c", "echo prepared; sleep 2"]
    - name: proxy
      image: busybox:1.36
      restartPolicy: Always
      command: ["sh", "-c", "while true; do echo proxy heartbeat; sleep 7; done"]
      # A mesh proxy's port lives on an init container, which is exactly the
      # port a forward is usually aimed at and exactly the one a reader of
      # `.containers` alone never sees.
      ports:
        - name: envoy-prom
          containerPort: 15090
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo app tick; sleep 5; done"]
      ports:
        - name: http
          containerPort: 8080
---
# The same shape as `sidecar-demo`, one level up: the init container and
# the native sidecar live in a *template*, which is where five kinds —
# Deployment, StatefulSet, DaemonSet, Job, CronJob — share one container
# type and all of them used to answer "which containers does this run"
# with `app` alone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshed-demo
  namespace: k8s-gui-test
  labels:
    app: meshed-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meshed-demo
  template:
    metadata:
      labels:
        app: meshed-demo
    spec:
      initContainers:
        - name: wait-for-config
          image: busybox:1.36
          command: ["sh", "-c", "echo fetching config; sleep 2; echo config ready"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
        - name: proxy
          image: busybox:1.36
          restartPolicy: Always
          command: ["sh", "-c", "while true; do echo proxy heartbeat; sleep 7; done"]
          ports:
            - name: envoy-prom
              containerPort: 15090
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo app tick; sleep 5; done"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
---
# A second kind carrying the same template shape, because the five detail
# pages share one renderer and a fix that only lands on Deployment is the
# drift this is meant to prevent. Suspended: the template is the point,
# not the run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: meshed-cron-demo
  namespace: k8s-gui-test
spec:
  schedule: "*/30 * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: fetch-input
              image: busybox:1.36
              command: ["sh", "-c", "echo fetching input; sleep 1"]
            - name: metrics-pusher
              image: busybox:1.36
              restartPolicy: Always
              command: ["sh", "-c", "while true; do echo pushing metrics; sleep 10; done"]
          containers:
            - name: report
              image: busybox:1.36
              command: ["sh", "-c", "echo report written"]
---
# `mounts-demo`: a pod that draws on every kind of source a reference can
# reach — a ConfigMap volume, a Secret volume, a claim, an env var from a
# ConfigMap key and one from a Secret key, a bulk envFrom, and a service
# account. `unread-config` is mounted by nothing on purpose: a volume no
# container reads is a silent mistake, and this is the specimen for it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mounts-demo
  namespace: k8s-gui-test
  labels:
    app: mounts-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mounts-demo
  template:
    metadata:
      labels:
        app: mounts-demo
    spec:
      serviceAccountName: k8s-gui-test
      initContainers:
        - name: seed
          image: busybox:1.36
          command: ["sh", "-c", "echo seeding from /etc/app; sleep 1"]
          volumeMounts:
            - name: app-config
              mountPath: /etc/app
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo serving; sleep 30; done"]
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: demo-config
                  key: app.conf
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-secret
                  key: password
          envFrom:
            - configMapRef:
                name: demo-config
          volumeMounts:
            - name: app-config
              mountPath: /etc/app
              readOnly: true
            - name: app-secret
              mountPath: /etc/creds
            - name: data
              mountPath: /var/lib/data
            - name: scratch
              mountPath: /tmp/scratch
      volumes:
        - name: app-config
          configMap:
            name: demo-config
        - name: app-secret
          secret:
            secretName: demo-secret
        - name: data
          persistentVolumeClaim:
            claimName: pvc-demo
        - name: scratch
          emptyDir: {}
        - name: unread-config
          configMap:
            name: demo-config
---
# A TLS certificate lives in a Secret, and "which Secret holds the cert for
# this host" is the question the Ingress TLS tab exists to answer. `log-demo`
# is deliberately left without TLS as the warning specimen, so the reference
# needs one of its own.
apiVersion: v1
kind: Secret
metadata:
  name: tls-demo-cert
  namespace: k8s-gui-test
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    not-a-real-certificate
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    not-a-real-key
    -----END PRIVATE KEY-----
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tls-demo
  namespace: k8s-gui-test
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tls-demo.local
      secretName: tls-demo-cert
  rules:
    - host: tls-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tls-demo
                port:
                  number: 80
---
# The chain that stops at the Service: the Ingress is wired, the Service
# exists, and its selector matches no pod in the namespace. Nothing carries
# `app: tls-demo` on purpose — anything reaching tls-demo.local gets a
# connection refused, and no list page in the app says so.
apiVersion: v1
kind: Service
metadata:
  name: tls-demo
  namespace: k8s-gui-test
spec:
  type: ClusterIP
  selector:
    app: tls-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# The chain that stops one hop earlier: an Ingress backend naming a Service
# that does not exist. Distinct from `tls-demo` — there the Service is real
# and empty, here there is no Service at all, and the two are not the same
# repair.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghost-demo
  namespace: k8s-gui-test
spec:
  ingressClassName: nginx
  rules:
    - host: ghost-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ghost-demo
                port:
                  number: 80
---
# The chain that stops last, and the one the rest of the app hides: pods
# exist, the selector matches them, and not one of them is ready. The
# readiness probe hits a port nothing listens on, so the pods run forever
# and the Service has no endpoints. Every list page shows this workload
# `Running`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unready-demo
  namespace: k8s-gui-test
  labels:
    app: unready-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unready-demo
  template:
    metadata:
      labels:
        app: unready-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo not ready; sleep 30; done"]
          readinessProbe:
            tcpSocket:
              port: 9999
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: unready-demo
  namespace: k8s-gui-test
spec:
  type: ClusterIP
  selector:
    app: unready-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# A Service with no selector at all. It selects no pods, which is not the
# same as selecting pods and finding none — the specimen that stops an
# emptiness check from reading a name that was never there as a fault.
apiVersion: v1
kind: Service
metadata:
  name: external-demo
  namespace: k8s-gui-test
spec:
  type: ExternalName
  externalName: example.com
---
# An Ingress backend that names an API object instead of a Service. The app
# does not follow one, and the path has to survive being unfollowable.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resource-demo
  namespace: k8s-gui-test
spec:
  ingressClassName: nginx
  rules:
    - host: resource-demo.local
      http:
        paths:
          - path: /assets
            pathType: Prefix
            backend:
              resource:
                apiGroup: k8s.example.com
                kind: StorageBucket
                name: assets
---
# --- cert-manager fixtures -------------------------------------------------
# Everything below needs cert-manager in the cluster; without it these
# objects are skipped and the rest of this file still applies, which is
# itself the state worth testing:
#
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.3/cert-manager.yaml
#
# A self-signed root, so nothing here ever talks to a real CA, and a local
# ACME server (Pebble) whose HTTP-01 validation cannot reach these hosts —
# which is the failing issuance chain the feature exists for, with no risk
# to anybody's Let's Encrypt rate limit.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: k8s-gui-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8s-gui-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: k8s-gui test root
  secretName: k8s-gui-root-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: k8s-gui-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: k8s-gui-ca
spec:
  ca:
    secretName: k8s-gui-root-ca
---
# Healthy: 90 days, renews 30 days out. The quiet case, and the one most
# certificates are in forever.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shop-tls
  namespace: k8s-gui-test
spec:
  secretName: shop-tls
  duration: 2160h
  renewBefore: 720h
  commonName: shop.k8s-gui.test
  dnsNames:
    - shop.k8s-gui.test
    - www.shop.k8s-gui.test
  issuerRef:
    name: k8s-gui-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
# Near expiry: issued for 10 days and told not to renew until the last hour,
# so it sits inside the window a reader is supposed to act in.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: checkout-tls
  namespace: k8s-gui-test
spec:
  secretName: checkout-tls
  duration: 240h
  renewBefore: 1h
  commonName: checkout.k8s-gui.test
  dnsNames:
    - checkout.k8s-gui.test
  issuerRef:
    name: k8s-gui-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: k8s-gui-test
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - shop.k8s-gui.test
      secretName: shop-tls
  rules:
    - host: shop.k8s-gui.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-demo
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkout
  namespace: k8s-gui-test
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - checkout.k8s-gui.test
      secretName: checkout-tls
  rules:
    - host: checkout.k8s-gui.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-demo
                port:
                  number: 80
---
# Pebble: a local ACME server. Its HTTP-01 validation reaches out to
# <host>:5002, which does not resolve for these test hosts — so the Order
# gets a Challenge and the Challenge fails with a sentence worth reading.
apiVersion: v1
kind: Service
metadata:
  name: pebble
  namespace: k8s-gui-test
spec:
  selector:
    app: pebble
  ports:
    - name: acme
      port: 14000
      targetPort: 14000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pebble
  namespace: k8s-gui-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pebble
  template:
    metadata:
      labels:
        app: pebble
    spec:
      containers:
        - name: pebble
          image: ghcr.io/letsencrypt/pebble:latest
          args: ["-config", "/test/config/pebble-config.json"]
          env:
            - name: PEBBLE_VA_NOSLEEP
              value: "1"
          ports:
            - containerPort: 14000
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: pebble-acme
  namespace: k8s-gui-test
spec:
  acme:
    server: https://pebble.k8s-gui-test.svc:14000/dir
    skipTLSVerify: true
    privateKeySecretRef:
      name: pebble-acme-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
# The screen the whole feature exists for: an ACME certificate whose
# challenge cannot complete, four objects deep.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: promo-tls
  namespace: k8s-gui-test
spec:
  secretName: promo-tls
  commonName: promo.k8s-gui.test
  dnsNames:
    - promo.k8s-gui.test
  issuerRef:
    name: pebble-acme
    kind: Issuer
    group: cert-manager.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: promo
  namespace: k8s-gui-test
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - promo.k8s-gui.test
      secretName: promo-tls
  rules:
    - host: promo.k8s-gui.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-demo
                port:
                  number: 80

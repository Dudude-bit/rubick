      targetPort: http
---
# 3. A pod that keeps taking traffic while it terminates. The grace period and
#    the preStop sleep are wide enough to read `serving: true, ready: false`
#    on screen; the legacy Endpoints object drops it entirely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: draining-demo
  namespace: k8s-gui-test
  labels:
    app: draining-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: draining-demo
  template:
    metadata:
      labels:
        app: draining-demo
    spec:
      terminationGracePeriodSeconds: 900
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 900"]
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: draining-demo
  namespace: k8s-gui-test
spec:
  selector:
    app: draining-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
# 4. Headless: no cluster IP by design, and a slice all the same.
apiVersion: v1
kind: Service
metadata:
  name: headless-demo
  namespace: k8s-gui-test
spec:
  clusterIP: None
  selector:
    app: log-demo
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# 5. No selector at all, and endpoints written by hand. The mirroring
#    controller turns the legacy object into a slice, which is what the app
#    reads back — and no finding is raised, because nothing here is broken.
apiVersion: v1
kind: Service
metadata:
  name: manual-demo
  namespace: k8s-gui-test
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: manual-demo
  namespace: k8s-gui-test
subsets:
  - addresses:
      - ip: 10.42.9.11
      - ip: 10.42.9.12
    ports:
      - name: http
        port: 8080
        protocol: TCP
---
# 6. Topology-aware routing: one pod per zone, and hints that keep a client's
#    traffic in its own. Needs the node labels named at the top of this block.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topology-demo
  namespace: k8s-gui-test
  labels:
    app: topology-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: topology-demo
  template:
    metadata:
      labels:
        app: topology-demo
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: topology-demo
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: topology-demo
  namespace: k8s-gui-test
spec:
  trafficDistribution: PreferClose
  selector:
    app: topology-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
# --- A selector that is not a list of equalities -----------------------------
#
# `matchExpressions` is half of what `metav1.LabelSelector` can say, and every
# selector test in this app used to read `matchLabels` and stop. A workload
# selecting its pods by a set-based requirement came back with no pods at all,
# and the traffic chain — which promises to say *where the path stops* — would
# have printed "no pod carries this selector" over a Deployment serving
# traffic. Cleanup:
#
#   kubectl delete -n k8s-gui-test deploy/expr-demo svc/expr-demo \
#     pdb/expr-demo
#
# One thing this cannot demonstrate, and it is worth writing down: a Service's
# `spec.selector` is a plain `map[string]string`, not a `LabelSelector`. There
# is no such thing as a Service with `matchExpressions`; the API server prunes
# it. The Service here selects the same pods by equality, which is what makes
# it the control — the chain in front of an expression-selected workload has to
# be as healthy as the chain in front of any other.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expr-demo
  namespace: k8s-gui-test
  labels:
    app: expr-demo
spec:
  replicas: 2
  # All four operators in one selector, and no `matchLabels` at all: read by
  # the old code this selector was empty, which the same code then read as
  # "matches nothing".
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [expr-demo, expr-demo-old]
      - key: tier
        operator: Exists
      - key: track
        operator: NotIn
        values: [canary]
      - key: retired
        operator: DoesNotExist
  template:
    metadata:
      labels:
        app: expr-demo
        tier: web
        track: stable
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: expr-demo
  namespace: k8s-gui-test
spec:
  selector:
    app: expr-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
# A budget whose selector is set-based. `policy/v1` reads an absent selector as
# "no pods" and an empty `{}` one as "every pod in the namespace" — the reverse
# of a Service's rule — so the two shapes cannot share one emptiness test.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: expr-demo
  namespace: k8s-gui-test
spec:
  minAvailable: 1
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [expr-demo]
      - key: track
        operator: NotIn
        values: [canary]

---
# --- ingress-nginx routing page ------------------------------------------
#
# ingress-nginx is not in this file: it has no CRDs and installs as a
# controller Deployment plus an IngressClass, from its own static manifest.
# Install it first, as NodePort so it does not fight k3d's Traefik for the
# load balancer — this page reads objects, not traffic, so that is enough:
#
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/baremetal/deploy.yaml
#
# Then let the snippets below through, which the shipped ConfigMap forbids
# by default, and set two global settings the page has something to say
# about:
#
#   kubectl -n ingress-nginx patch configmap ingress-nginx-controller \
#     --type merge -p '{"data":{"allow-snippet-annotations":"true",
#     "annotations-risk-level":"Critical","proxy-body-size":"8m",
#     "use-forwarded-headers":"true","server-tokens":"false",
#     "ssl-protocols":"TLSv1.2 TLSv1.3",
#     "log-format-upstream":"$remote_addr - $status $request_time"}}'
#
# Cleanup:
#
#   kubectl -n k8s-gui-test delete ingress \
#     shop-nginx promo-nginx promo-nginx-canary snippet-nginx \
#     ghost-nginx plain-nginx dupe-nginx-old dupe-nginx-new lonely-canary
#   kubectl delete -f <the ingress-nginx manifest above>

---
# Twelve annotations, which is the case the page exists for: a plain Ingress
# carrying a program. Ten of them decode; `mirror-target` is not in the
# app's table and `proxy-body-size: enormous` is a value it will not read, so
# both are printed as written and said to be.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-nginx
  namespace: k8s-gui-test
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/whitelist-source-range: 10.0.0.0/8,192.168.0.0/16
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: demo-secret
    nginx.ingress.kubernetes.io/auth-realm: Staging only
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/mirror-target: https://mirror.k8s-gui.test/$request_uri
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - shop.nginx.k8s-gui.test
      secretName: shop-tls
  rules:
    - host: shop.nginx.k8s-gui.test
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: log-demo
                port:
                  number: 80
---
# The canary pair. Two Ingresses, one host, and the page must draw it as one
# host divided 80/20 rather than as two hosts each taking everything.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: promo-nginx
  namespace: k8s-gui-test
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - promo.nginx.k8s-gui.test
      secretName: shop-tls
  rules:
    - host: promo.nginx.k8s-gui.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-demo
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: promo-nginx-canary
  namespace: k8s-gui-test
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
spec:
  ingressClassName: nginx
  rules:
    - host: promo.nginx.k8s-gui.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: topology-demo
                port:
                  number: 80
---
# A canary with no host to shadow. nginx merges a canary into the server
# block of a host another Ingress already serves; there is no such block
# here, so this is correct YAML that is never served.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lonely-canary
  namespace: k8s-gui-test
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: X-Preview
spec:
  ingressClassName: nginx
  rules:
    - host: lonely.nginx.k8s-gui.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-demo
                port:
                  number: 80
---
# The rule the whole annotation feature is built on. Raw nginx config, shown
# as written and flagged as raw — never paraphrased at any confidence.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snippet-nginx
  namespace: k8s-gui-test
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Env: staging";
      if ($request_uri ~* "^/internal") {
        return 403;
      }
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /healthz { return 200 'ok'; }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - snippet.nginx.k8s-gui.test
      secretName: shop-tls
  rules:
    - host: snippet.nginx.k8s-gui.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-demo
                port:
                  number: 80
---
# A backend that was never created.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghost-nginx
  namespace: k8s-gui-test
spec:
  ingressClassName: nginx
  rules:
    - host: ghost.nginx.k8s-gui.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: never-created
                port:
                  number: 80
---
# Served in the clear, and carrying the annotation that looks like it fixes
# that. `ssl-redirect` does nothing on a host with no certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plain-nginx
  namespace: k8s-gui-test
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: internal.nginx.k8s-gui.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-demo
                port:
                  number: 80
---
# Two objects, one host, one path. nginx serves the older one and logs a
# warning nothing else in this cluster surfaces.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dupe-nginx-old
  namespace: k8s-gui-test
spec:
  ingressClassName: nginx
  rules:
    - host: legacy.nginx.k8s-gui.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-demo
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1

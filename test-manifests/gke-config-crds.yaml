# BackendConfig and FrontendConfig, as GKE's own controller creates them.
#
# These two are the only CRDs in this directory that are not a copy of a file
# a vendor publishes, because ingress-gce publishes none: it builds them in Go
# at controller start, from `pkg/crd` and the openapi definitions generated
# off `pkg/apis/backendconfig` and `pkg/apis/frontendconfig`. So this file is
# not hand-written either — it is what upstream's own `EnsureCRD` put into a
# cluster, read back out of the API server, with the resourceVersion and the
# Established condition stripped.
#
# Reproduce it by building against upstream and pointing it at a cluster:
#
#   crd.NewCRDHandler(client, klog.TODO()).EnsureCRD(backendconfig.CRDMeta(), true)
#   crd.NewCRDHandler(client, klog.TODO()).EnsureCRD(frontendconfig.CRDMeta(), true)
#
# The one thing worth reading in the schema below, because everything the app
# does with these objects follows from it: `status` is an object with **no
# properties**. Both types are declared `+genclient:noStatus` upstream. These
# objects state what a Google load balancer will be told and never whether it
# worked, so nothing drawn from them may read as a verdict.
#
#   kubectl apply -f test-manifests/gke-config-crds.yaml
#   kubectl delete -f test-manifests/gke-config-crds.yaml

version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
    ignore:
      # Held at the version tauri and kube pull in, so one copy is compiled
      # instead of two. Move them when those do.
      - dependency-name: "base64"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "dirs"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
    ignore:
      # Keep @types/node in lockstep with the Node major actually used in CI
      # (`node-version: 24` in setup-tauri). Major bumps require coordinated
      # changes to mise.toml, the composite action, and CONTRIBUTING.md.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

name: 'Setup Tauri build environment'
description: 'Installs Bun, Node, Rust, system deps, and (optionally) tauri-cli for Tauri builds'

inputs:
  target:
    description: 'Rust target triple (e.g. x86_64-unknown-linux-gnu)'
    required: true
  is_linux:
    description: 'Set to "true" when the matrix job is a Linux build'
    required: false
    default: 'false'
  install_tauri_cli:
    description: 'Install the `tauri` CLI binary. Not needed when using tauri-action (which bundles it).'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Bun is the package manager; Node is still the runtime the JS toolchain
    # (vite, vitest, tsc, eslint) shebangs into, so both are pinned here.
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
      with:
        node-version: 24

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      with:
        bun-version: 1.3.8

    - name: Install JS dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2025
      with:
        targets: ${{ inputs.target }}

    - name: Rust cache
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      with:
        cache-on-failure: true

    - name: Install Tauri CLI binary
      if: inputs.install_tauri_cli == 'true'
      uses: taiki-e/install-action@787505cde8a44ea468a00478fe52baf23b15bccd  # v2.75.21
      with:
        tool: tauri-cli

    - name: Install system dependencies (Linux)
      if: inputs.is_linux == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential curl git pkg-config \
          libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev libssl-dev ca-certificates
        # FUSE 2, for the AppImage bundle. linuxdeploy ships as an AppImage
        # itself and mounts itself to run; 24.04 carries only FUSE 3, so it
        # exits before printing anything and tauri reports the unhelpful
        # `failed to run linuxdeploy`. The package was renamed in the 64-bit
        # time_t transition, so try the new name first.
        sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

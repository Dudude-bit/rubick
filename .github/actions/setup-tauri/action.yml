name: 'Setup Tauri build environment'
description: 'The JS and the Rust toolchains together, for a job that builds the app'

inputs:
  target:
    description: 'Rust target triple (e.g. x86_64-unknown-linux-gnu)'
    required: true
  is_linux:
    description: 'Set to "true" when the job builds on Linux'
    required: false
    default: 'false'

# No tauri-cli install: the CLI is a devDependency, and `bun run tauri` is the
# one bun.lock pins — the same one tauri-action picks up in release.yml. A
# separately installed "latest" built PRs with a different CLI from releases.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-js
    - uses: ./.github/actions/setup-rust
      with:
        target: ${{ inputs.target }}
        is_linux: ${{ inputs.is_linux }}

    # The bundler saves the AppRun it downloads as 0770 and copies it into
    # the AppImage as AppRun.wrapped, which a user other than the mount's
    # owner cannot start: firejail --appimage, and the AppImage catalog's
    # test (tauri#16155). A copy already in its cache is used as it is.
    - name: AppRun anyone can start (Linux)
      if: inputs.is_linux == 'true'
      shell: bash
      run: |
        tools="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
        mkdir -p "$tools"
        apprun="$tools/AppRun-$(uname -m)"
        curl -fsSL --retry 3 -o "$apprun" \
          "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-$(uname -m)"
        chmod 755 "$apprun"

name: 'Setup Tauri build environment'
description: 'The JS and the Rust toolchains together, for a job that builds the app'

inputs:
  target:
    description: 'Rust target triple (e.g. x86_64-unknown-linux-gnu)'
    required: true
  is_linux:
    description: 'Set to "true" when the job builds on Linux'
    required: false
    default: 'false'

# No tauri-cli install: the CLI is a devDependency, and `bun run tauri` is the
# one bun.lock pins — the same one tauri-action picks up in release.yml. A
# separately installed "latest" built PRs with a different CLI from releases.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-js
    - uses: ./.github/actions/setup-rust
      with:
        target: ${{ inputs.target }}
        is_linux: ${{ inputs.is_linux }}

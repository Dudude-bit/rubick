name: 'Set up the JS toolchain'
description: 'Installs Node and Bun, then the locked JS dependencies'

runs:
  using: composite
  steps:
    # Bun is the package manager; Node is still the runtime the JS toolchain
    # (vite, vitest, tsc, eslint) shebangs into, so both are pinned here.
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
      with:
        node-version: 24

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      with:
        bun-version: 1.3.8

    - name: Install JS dependencies
      shell: bash
      run: bun install --frozen-lockfile

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-24.04

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri
        with:
          target: x86_64-unknown-linux-gnu
          is_linux: 'true'
          install_tauri_cli: 'false'

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Build frontend
        # Required so `tauri::generate_context!()` can read ../dist during
        # cargo clippy / cargo test. (build.yml goes through cargo tauri
        # build which runs bun run build via beforeBuildCommand; here we
        # don't, so we do it explicitly.)
        run: bun run build

      - name: Rust clippy
        # The tree is quiet: every finding is either fixed or allowed where it
        # applies, with the reason next to it. A new one should stop the PR
        # rather than join a backlog nobody reads.
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      - name: Rust tests
        # --workspace, not just src-tauri: k8s-gui-common carries unit
        # tests and doctests that a manifest-scoped run never reaches.
        run: cargo test --workspace

      - name: Frontend type check
        run: bunx tsc --noEmit

      - name: Frontend tests
        run: bun run test

      - name: Frontend lint
        run: bun run lint

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v2.0.0). Must already exist.'
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            is_linux: true
          # linux-arm64 disabled: libglib2.0-dev arm64 deps unresolvable on GitHub runners.
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            is_macos: true
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            is_macos: true
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            is_windows: true

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract release notes for tag
        id: changelog
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # Extract the section under `## [VERSION]` (excluding the
          # heading line itself) up to the next `## [` heading
          # (exclusive). Falls back to the whole file if the section
          # is missing so we never ship an empty body silently.
          NOTES=$(awk -v v="$VERSION" '
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "^## \\[" v "\\]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG section for $VERSION; using full file"
            NOTES=$(cat CHANGELOG.md)
          fi
          {
            echo "notes<<__RELEASE_NOTES_EOF__"
            echo "$NOTES"
            echo "__RELEASE_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri
        with:
          target: ${{ matrix.target }}
          is_linux: ${{ matrix.is_linux || false }}
          is_macos: ${{ matrix.is_macos || false }}
          is_windows: ${{ matrix.is_windows || false }}
          # tauri-action bundles its own CLI, don't install again
          install_tauri_cli: 'false'

      - name: Build, sign, and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: ${{ github.event.inputs.tag || github.ref_name }}
          # tauri-action 0.6+ replaced `releaseBodyPath` (a file path)
          # with `releaseBody` (a string). Body comes from the
          # changelog-extraction step above.
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

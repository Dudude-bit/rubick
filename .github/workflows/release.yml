name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v2.0.0). Must already exist.'
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # GitHub's default is 6 hours. Notarisation is a poll against Apple's
    # notary service, and a submission that never leaves "In Progress"
    # takes the whole job down with it — v3.0.1 burned ~4 hours per macOS
    # runner that way before failing on an unrelated network blip. A cold
    # macOS build reaches "Notarizing" in well under 40 minutes, so 90
    # leaves ample room for a slow notarisation and still turns a hang
    # into a prompt, legible failure.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            is_linux: true
          # linux-arm64 disabled: libglib2.0-dev arm64 deps unresolvable on GitHub runners.
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            is_macos: true
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            is_macos: true
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            is_windows: true

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract release notes for tag
        id: changelog
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # Extract the section under `## [VERSION]` (excluding the
          # heading line itself) up to the next `## [` heading
          # (exclusive). Falls back to the whole file if the section
          # is missing so we never ship an empty body silently.
          NOTES=$(awk -v v="$VERSION" '
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "^## \\[" v "\\]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG section for $VERSION; using full file"
            NOTES=$(cat CHANGELOG.md)
          fi
          {
            echo "notes<<__RELEASE_NOTES_EOF__"
            echo "$NOTES"
            echo "__RELEASE_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri
        with:
          target: ${{ matrix.target }}
          is_linux: ${{ matrix.is_linux || false }}
          # tauri-action bundles its own CLI, don't install again
          install_tauri_cli: 'false'

      # notarytool wants the App Store Connect key as a *file*, so the
      # secret has to land on disk before the build. Runner temp is wiped
      # with the runner; nothing here reaches the workspace or a log.
      # The `secrets` context is not available to a step-level `if`, so the
      # key arrives as env and the emptiness check happens in the script.
      # Absent secret = no APPLE_API_KEY_PATH = tauri skips notarisation,
      # which is what keeps this workflow working before the secrets exist.
      - name: Write App Store Connect API key
        if: matrix.is_macos
        shell: bash
        env:
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "APPLE_API_KEY_P8 unset — building without notarisation."
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/asc_api_key.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign). Unrelated to Apple code signing —
          # this is what proves an update payload came from us; Gatekeeper
          # never sees it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing + notarization (macOS jobs only; the vars are
          # empty elsewhere and tauri skips both steps). Without these the
          # bundle carries only the linker's ad-hoc signature, and macOS
          # refuses a quarantined copy with "«Rubick» is damaged" rather
          # than the usual unidentified-developer prompt.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarisation via App Store Connect API key rather than an
          # Apple ID + app-specific password: no human account, no 2FA,
          # and the key is already the one this repo's owner uses elsewhere.
          # APPLE_API_KEY is the key *id*; the .p8 itself is written to disk
          # by the step above, which is why the path comes from $GITHUB_ENV.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: ${{ github.event.inputs.tag || github.ref_name }}
          # tauri-action 0.6+ replaced `releaseBodyPath` (a file path)
          # with `releaseBody` (a string). Body comes from the
          # changelog-extraction step above.
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

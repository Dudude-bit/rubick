# The Flatpak, built from the AppImage a release already published.
#
# Its own workflow rather than a job in `release.yml` for one reason: it has
# to be runnable against a release that already exists. RHEL 8 users are
# blocked on every artifact we have shipped so far, and telling them to wait
# for the next tag would be the wrong answer to a question about today.
#
# Why a Flatpak at all is in `packaging/flatpak/com.k8s_gui.app.yml`, with the
# glibc and WebKitGTK versions that make the other artifacts unrunnable there.
name: Flatpak

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Released tag to build the Flatpak for (e.g. v4.17.0).'
        required: true
      diagnose:
        description: 'Launch under several environments, keep the screenshots, attach nothing.'
        type: boolean
        default: false
  # After a release, for the tag that release was for. A draft is fine: the
  # download below reaches drafts, so the bundle is on the release before
  # anybody publishes it.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: flatpak-${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  bundle:
    name: flatpak
    # A failed Release has no AppImage; a *dispatched* one has no tag either,
    # since workflow_run carries the upstream ref and not its inputs. Skip
    # that rather than go red — this workflow's own dispatch takes the tag.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Refuse a run with no tag to build for
        run: |
          case "$TAG" in
            v*.*.*) echo "building for $TAG" ;;
            *) echo "::error::not a release tag: '$TAG'"; exit 1 ;;
          esac

      # The branch this workflow is running from, NOT the released tag: the
      # packaging recipe is not versioned with the app, and a tag cut before
      # it existed has no `packaging/` at all — which is exactly how the
      # first run of this failed. The AppImage comes from the tag below.
      - name: Checkout the packaging recipe
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Install flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder desktop-file-utils xvfb imagemagick

      - name: Add Flathub and install the runtime
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --noninteractive flathub \
            org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Take the AppImage from that release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `gh release download` reaches a draft; the public URL would not.
          # Extracted beside the manifest: a `dir` source is resolved
          # relative to the manifest's own directory, not the working one.
          cd packaging/flatpak
          gh release download "$TAG" --pattern '*_amd64.AppImage' --output rubick.AppImage
          chmod +x rubick.AppImage
          ./rubick.AppImage --appimage-extract > /dev/null

      - name: Build the bundle
        run: |
          flatpak-builder --user --force-clean --repo=repo builddir \
            packaging/flatpak/com.k8s_gui.app.yml
          # Without --runtime-repo the bundle points nowhere for its runtime,
          # and a stock AlmaLinux 8 — whose flatpak configures no remote —
          # refuses it with "runtime not found".
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "Rubick-${TAG#v}.flatpak" com.k8s_gui.app
          ls -la ./*.flatpak

      # Taken where the answer is not already known: the steps above put the
      # runtime on this runner, so the old check passed whether or not the
      # bundle could find one. A fresh FLATPAK_USER_DIR has neither.
      - name: Install it the way a reader with no Flathub would
        timeout-minutes: 25
        env:
          FLATPAK_USER_DIR: ${{ runner.temp }}/pristine
        run: |
          mkdir -p "$FLATPAK_USER_DIR"
          echo "remotes before the install (must be none):"
          flatpak --user remotes
          if [ -n "$(flatpak --user remotes)" ]; then
            echo "::error::the check location is not pristine"
            exit 1
          fi
          flatpak install -y --user --noninteractive "Rubick-${TAG#v}.flatpak"

      # The launch above goes through `command:`. Nobody else does: a menu
      # entry, and a `rubick://` link, go through the exported desktop file,
      # whose own Exec decides what runs. They have to be the same thing, or
      # this job stays green while every real launch opens a blank window.
      - name: Check the exported launcher runs what was just proven
        env:
          FLATPAK_USER_DIR: ${{ runner.temp }}/pristine
        run: |
          exported="$FLATPAK_USER_DIR/exports/share/applications/com.k8s_gui.app.desktop"
          cat "$exported"
          if ! grep -qE '^Exec=.*--command=rubick( |$)' "$exported"; then
            echo "::error::the exported desktop entry does not run the launcher"
            exit 1
          fi
          if ! grep -qE '^Exec=.*@@u %u @@|^Exec=.*%u' "$exported"; then
            echo "::error::the exported desktop entry passes no URL, so rubick:// links are dropped"
            exit 1
          fi
          echo "the menu entry and the smoke launch run the same thing"

      - name: Check every library resolves
        env:
          FLATPAK_USER_DIR: ${{ runner.temp }}/pristine
        run: |
          flatpak run --command=ldd com.k8s_gui.app /app/bin/Rubick > ldd.txt
          if grep -q "not found" ldd.txt; then
            echo "::error::unresolved libraries in the bundle"
            grep "not found" ldd.txt
            exit 1
          fi
          echo "every library resolved"

      # ldd reads one ELF's NEEDED list and says nothing about the WebKit
      # helper, the dlopen'd GTK modules, or the dropped environment — each of
      # which fails as a blank window. And "the process stayed up" is not a
      # window either: the web process aborting on EGL left the main one
      # alive behind a white window, and this step passed that on every
      # release until 4.19.0. `smoke.sh` looks at the screen.
      - name: Start it and require the app on screen
        if: ${{ github.event.inputs.diagnose != 'true' }}
        timeout-minutes: 5
        env:
          FLATPAK_USER_DIR: ${{ runner.temp }}/pristine
        run: |
          bash packaging/flatpak/smoke.sh launch
          echo "---- what it said ----"
          cat launch.log

      # The same launch under the environments a white window is usually
      # blamed on, each with its own screenshot — so a fix is chosen by what
      # it does on this runner, not by what a forum says it did elsewhere.
      - name: Diagnose the launch
        if: ${{ github.event.inputs.diagnose == 'true' }}
        timeout-minutes: 20
        env:
          FLATPAK_USER_DIR: ${{ runner.temp }}/pristine
        run: |
          set +e
          echo "---- libraries in /app/lib that the runtime also has ----"
          flatpak run --command=sh com.k8s_gui.app -c '
            for f in /app/lib/*.so* /app/lib/x86_64-linux-gnu/*.so*; do
              [ -e "$f" ] || continue
              b=$(basename "$f")
              [ -e "/usr/lib/x86_64-linux-gnu/$b" ] && echo "shadows $b"
            done' | sort | uniq
          echo "---- GL extension ----"
          flatpak --user list --runtime | grep -i gl || echo "no GL extension installed"
          bash packaging/flatpak/smoke.sh baseline
          bash packaging/flatpak/smoke.sh no-dmabuf --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
          bash packaging/flatpak/smoke.sh no-compositing --env=WEBKIT_DISABLE_COMPOSITING_MODE=1
          bash packaging/flatpak/smoke.sh both-off --env=WEBKIT_DISABLE_DMABUF_RENDERER=1 --env=WEBKIT_DISABLE_COMPOSITING_MODE=1
          bash packaging/flatpak/smoke.sh software-gl --env=LIBGL_ALWAYS_SOFTWARE=1
          for f in *.log; do echo "==== $f ===="; cat "$f"; done
          exit 0

      - name: Keep what the screen showed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: flatpak-screens-${{ env.TAG }}
          path: |
            *.png
            *.log
          if-no-files-found: ignore

      # Only a release's own run, or one dispatched from main, may replace the
      # asset people download: a diagnostic dispatch from a branch builds
      # the same file name and would silently clobber the published one.
      - name: Attach it to the release
        if: >-
          github.event.inputs.diagnose != 'true' &&
          (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "Rubick-${TAG#v}.flatpak" --clobber

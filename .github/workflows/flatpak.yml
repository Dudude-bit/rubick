# The Flatpak, built from the .deb a release already published.
#
# Its own workflow rather than a job in `release.yml` for one reason: it has
# to be runnable against a release that already exists. RHEL 8 users are
# blocked on every artifact we have shipped so far, and telling them to wait
# for the next tag would be the wrong answer to a question about today.
#
# Why a Flatpak at all is in `packaging/flatpak/com.k8s_gui.app.yml`, with the
# glibc and WebKitGTK versions that make the other artifacts unrunnable there.
name: Flatpak

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Released tag to build the Flatpak for (e.g. v4.17.0).'
        required: true
      diagnose:
        description: 'Launch under several environments, keep the screenshots, attach nothing.'
        type: boolean
        default: false
  # After a release, for the tag that release was for. A draft is fine: the
  # download below reaches drafts, so the bundle is on the release before
  # anybody publishes it.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: flatpak-${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  bundle:
    name: flatpak ${{ matrix.gnome }}
    # A failed Release has no .deb; a *dispatched* one has no tag either,
    # since workflow_run carries the upstream ref and not its inputs. Skip
    # that rather than go red — this workflow's own dispatch takes the tag.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # One entry for a release: the runtime the manifest names. A diagnosis
    # builds against several GNOME runtimes side by side, so which one works
    # is read off screenshots rather than guessed from changelogs.
    strategy:
      fail-fast: false
      matrix:
        gnome: ${{ fromJSON(github.event.inputs.diagnose == 'true' && '["50","51"]' || '["manifest"]') }}
    env:
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Refuse a run with no tag to build for
        run: |
          case "$TAG" in
            v*.*.*) echo "building for $TAG" ;;
            *) echo "::error::not a release tag: '$TAG'"; exit 1 ;;
          esac

      # The branch this workflow is running from, NOT the released tag: the
      # packaging recipe is not versioned with the app, and a tag cut before
      # it existed has no `packaging/` at all — which is exactly how the
      # first run of this failed. The .deb comes from the tag below.
      - name: Checkout the packaging recipe
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Install flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder desktop-file-utils xvfb imagemagick

      - name: Pick the runtime
        run: |
          manifest=packaging/flatpak/com.k8s_gui.app.yml
          if [ "${{ matrix.gnome }}" != manifest ]; then
            sed -i "s/^runtime-version: .*/runtime-version: '${{ matrix.gnome }}'/" "$manifest"
          fi
          version=$(sed -n "s/^runtime-version: '\(.*\)'/\1/p" "$manifest")
          echo "GNOME=$version" >> "$GITHUB_ENV"
          echo "building against org.gnome.Platform//$version"

      - name: Add Flathub and install the runtime
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --noninteractive flathub \
            "org.gnome.Platform//$GNOME" "org.gnome.Sdk//$GNOME"

      - name: Take the .deb from that release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `gh release download` reaches a draft; the public URL would not.
          # Beside the manifest: a `file` source is resolved relative to the
          # manifest's own directory, not the working one.
          cd packaging/flatpak
          gh release download "$TAG" --pattern '*_amd64.deb' --output rubick.deb

      - name: Build the bundle
        run: |
          flatpak-builder --user --force-clean --repo=repo builddir \
            packaging/flatpak/com.k8s_gui.app.yml
          # Without --runtime-repo the bundle points nowhere for its runtime,
          # and a stock AlmaLinux 8 — whose flatpak configures no remote —
          # refuses it with "runtime not found".
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "Rubick-${TAG#v}.flatpak" com.k8s_gui.app
          ls -la ./*.flatpak

      # Taken where the answer is not already known: the steps above put the
      # runtime on this runner, so the old check passed whether or not the
      # bundle could find one. A fresh FLATPAK_USER_DIR has neither.
      - name: Install it the way a reader with no Flathub would
        timeout-minutes: 25
        env:
          FLATPAK_USER_DIR: ${{ runner.temp }}/pristine
        run: |
          mkdir -p "$FLATPAK_USER_DIR"
          echo "remotes before the install (must be none):"
          flatpak --user remotes
          if [ -n "$(flatpak --user remotes)" ]; then
            echo "::error::the check location is not pristine"
            exit 1
          fi
          flatpak install -y --user --noninteractive "Rubick-${TAG#v}.flatpak"

      # The launch above goes through `command:`. Nobody else does: a menu
      # entry, and a `rubick://` link, go through the exported desktop file,
      # whose own Exec decides what runs. They have to be the same thing, or
      # this job stays green while every real launch opens a blank window.
      - name: Check the exported launcher runs what was just proven
        env:
          FLATPAK_USER_DIR: ${{ runner.temp }}/pristine
        run: |
          exported="$FLATPAK_USER_DIR/exports/share/applications/com.k8s_gui.app.desktop"
          cat "$exported"
          if ! grep -qE '^Exec=.*--command=Rubick( |$)' "$exported"; then
            echo "::error::the exported desktop entry does not run the launcher"
            exit 1
          fi
          if ! grep -qE '^Exec=.*@@u %u @@|^Exec=.*%u' "$exported"; then
            echo "::error::the exported desktop entry passes no URL, so rubick:// links are dropped"
            exit 1
          fi
          echo "the menu entry and the smoke launch run the same thing"

      - name: Check every library resolves
        env:
          FLATPAK_USER_DIR: ${{ runner.temp }}/pristine
        run: |
          flatpak run --command=ldd com.k8s_gui.app /app/bin/Rubick > ldd.txt
          if grep -q "not found" ldd.txt; then
            echo "::error::unresolved libraries in the bundle"
            grep "not found" ldd.txt
            exit 1
          fi
          echo "every library resolved"
          # Links open through the runtime's xdg-open, which hands them to the
          # portal. The old bundle copied the AppImage's usr/bin and put
          # Ubuntu's xdg-open first on PATH, where no portal is spoken.
          opener=$(flatpak run --command=sh com.k8s_gui.app -c 'command -v xdg-open')
          if [ "$opener" != /usr/bin/xdg-open ]; then
            echo "::error::xdg-open resolves to '$opener', not the runtime's portal forwarder"
            exit 1
          fi
          echo "links open through $opener"

      # ldd reads one ELF's NEEDED list and says nothing about the WebKit
      # helper, the dlopen'd GTK modules, or the dropped environment — each of
      # which fails as a blank window. And "the process stayed up" is not a
      # window either: the web process aborting on EGL left the main one
      # alive behind a white window, and this step passed that on every
      # release until 4.19.0. `smoke.sh` looks at the screen.
      - name: Start it and require the app on screen
        if: ${{ github.event.inputs.diagnose != 'true' }}
        timeout-minutes: 5
        env:
          FLATPAK_USER_DIR: ${{ runner.temp }}/pristine
        run: |
          bash packaging/flatpak/smoke.sh launch
          echo "---- what it said ----"
          cat launch.log

      # The same launch under the environments a white window is usually
      # blamed on, each with its own screenshot — so a fix is chosen by what
      # it does on this runner, not by what a forum says it did elsewhere.
      - name: Diagnose the launch
        if: ${{ github.event.inputs.diagnose == 'true' }}
        timeout-minutes: 10
        env:
          FLATPAK_USER_DIR: ${{ runner.temp }}/pristine
        run: |
          set +e
          echo "---- what the bundle carries beside the binary ----"
          flatpak run --command=sh com.k8s_gui.app -c 'ls -la /app/lib'
          bash packaging/flatpak/smoke.sh "gnome-$GNOME"
          cat "gnome-$GNOME.log"
          exit 0

      - name: Keep what the screen showed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: flatpak-screens-${{ env.TAG }}-${{ matrix.gnome }}
          path: |
            *.png
            *.log
          if-no-files-found: ignore

      - name: Keep the bundle for the next jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: flatpak-bundle-${{ matrix.gnome }}
          path: Rubick-*.flatpak
          if-no-files-found: error

  # The platform this bundle exists for, with the flatpak that platform ships
  # — 1.12 on AlmaLinux 8, not the runner's. Installed the way a reader
  # would: no Flathub remote, the runtime fetched through the bundle's own
  # --runtime-repo. Nothing here was ever run before 4.20; a runtime the old
  # flatpak cannot handle would otherwise be found by the next person on RHEL 8.
  el8:
    name: almalinux 8 ${{ matrix.gnome }}
    needs: bundle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gnome: ${{ fromJSON(github.event.inputs.diagnose == 'true' && '["50","51"]' || '["manifest"]') }}
    steps:
      - name: Checkout the smoke check
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Take the bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: flatpak-bundle-${{ matrix.gnome }}

      - name: Install and launch it on AlmaLinux 8
        timeout-minutes: 30
        run: |
          # --privileged: flatpak runs the app in bubblewrap, which needs the
          # namespaces a default container withholds.
          docker run --rm --privileged -v "$PWD:/w" -w /w almalinux:8 bash -c '
            set -e
            dnf -y -q install epel-release >/dev/null
            dnf -y -q install flatpak xorg-x11-server-Xvfb ImageMagick dbus-daemon procps-ng >/dev/null
            echo "flatpak on this host: $(flatpak --version)"
            if [ -n "$(flatpak --user remotes)" ]; then
              echo "::error::the check location is not pristine"; exit 1
            fi
            flatpak install -y --user --noninteractive ./Rubick-*.flatpak
            dbus-run-session -- bash packaging/flatpak/smoke.sh almalinux8
          '

      - name: Keep what the screen showed
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: flatpak-screens-el8-${{ matrix.gnome }}
          path: |
            *.png
            *.log
          if-no-files-found: ignore

  # Only after both launches passed, and only a release's own run or one
  # dispatched from main: a diagnostic dispatch from a branch builds the
  # same file name and would silently clobber the published asset.
  attach:
    name: attach to the release
    needs: [bundle, el8]
    if: >-
      github.event.inputs.diagnose != 'true' &&
      (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Take the bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: flatpak-bundle-manifest

      - name: Attach it to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "Rubick-${TAG#v}.flatpak" --clobber --repo "$GITHUB_REPOSITORY"

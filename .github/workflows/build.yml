name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      lto:
        description: 'Link-time optimisation: off as on every push, or fat to build exactly what release.yml ships'
        type: choice
        options: ['off', 'thin', 'fat']
        default: 'off'
  push:
    branches: [main]
    # Prose and the site: nothing any job here builds or reads. Never
    # CHANGELOG.md — What's New embeds it — and never a blanket **/*.md.
    paths-ignore: &docs
      - 'web/**'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CLAUDE.md'
      - 'SECURITY.md'
      - 'habr-*.md'
      - 'LICENSE*'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [main]
    # `labeled`: the plan reads the build-all label, and without it adding
    # the label built nothing until the next push.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: *docs

permissions:
  contents: read

concurrency:
  # Any other label plans nothing, so it gets a group of its own rather than
  # cancelling the builds in flight.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'build-all' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A pull request is checked out as its merge commit, whose first
          # parent is main: two commits are enough to diff against it.
          fetch-depth: 2

      - name: Pick the platforms
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ADDED_LABEL: ${{ github.event.action == 'labeled' && github.event.label.name || '' }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          base=""
          [ "$EVENT" = pull_request ] && base="HEAD^1"
          python3 scripts/build-matrix.py "$EVENT" "$LABELS" "$MESSAGE" $base | tee -a "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    if: fromJSON(needs.plan.outputs.matrix).include[0] != null
    runs-on: ${{ matrix.os }}
    # Nothing here takes an hour; without a limit a hung job holds one of
    # five macOS slots for GitHub's default six.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    # On the job, not the build step: rust-cache hashes CARGO_* variables into
    # its key when it restores, and a step-level override is invisible to it.
    # The key would then name a fat-LTO cache, cargo would rebuild everything
    # against the different flags, and the post step would report the key
    # already saved — cold forever, with nothing failing.
    #
    # Off unless asked: fat LTO with one codegen unit is most of the build's
    # time, and it is what release.yml ships, not what a push needs to prove.
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.lto || 'off' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.lto == 'fat' && '1' || '16' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Tauri build environment
        uses: ./.github/actions/setup-tauri
        with:
          target: ${{ matrix.target }}
          is_linux: ${{ matrix.is_linux || false }}

      - name: Build (tauri)
        # Skip updater-artifact signing in PR validation — release.yml has the secrets.
        # Frontend is built automatically by `tauri build` via beforeBuildCommand.
        env:
          # linuxdeploy, which bundles the AppImage, is an AppImage itself and
          # mounts itself to run — needing FUSE 2 and /dev/fuse, neither of
          # which ubuntu-24.04 has. Extracting instead needs neither. Harmless
          # on macOS and Windows, which never read it.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bun run tauri build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --timings

      - name: Collect installers
        # The installers only: the bundle directories also hold the AppImage's
        # unpacked AppDir and the unpacked .app, hundreds of files nobody
        # downloads.
        shell: bash
        run: |
          mkdir -p artifacts
          bundle="target/${{ matrix.target }}/release/bundle"
          find "$bundle" -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp -v {} artifacts/ \;
          ls -la artifacts

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*
          if-no-files-found: error

      - name: Upload cargo timings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cargo-timings-${{ matrix.name }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: warn

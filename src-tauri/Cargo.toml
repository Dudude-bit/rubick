[package]
name = "k8s-gui"
version = "4.20.0"
edition = "2021"
rust-version = "1.91"
authors = ["Rubick Team"]
description = "A minimalist Kubernetes GUI client inspired by Lens"
license = "GPL-3.0-or-later"

[lib]
name = "k8s_gui_lib"
# rlib only: the binary and the tests are all that link it. Tauri's template
# adds staticlib and cdylib for iOS and Android — bring them back with a
# mobile target — and every build paid for them: a ~900 MB archive per debug
# rebuild, and machine code for every dependency under release LTO.
crate-type = ["rlib"]

# The process name is what macOS prints in the dev app bar, where there is
# no bundle to spell "Rubick" over it. The crate keeps its name; only the
# binary wears the product's.
[[bin]]
name = "Rubick"
path = "src/main.rs"

[dependencies]
# Tauri
tauri = { version = "2.1", features = ["image-png", "devtools"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"

# Async runtime
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Kubernetes
tower = { version = "0.5", features = ["timeout"] }
kube = { version = "4.2", default-features = false, features = ["client", "config", "runtime", "ws", "oauth", "oidc", "rustls-tls", "ring", "gzip", "jsonpatch"] }
# For `Patch::Json`; the same version kube itself resolves.
json-patch = "4.2"  # must match the version `kube` resolves, or `Patch::Json` sees a different type
k8s-openapi = { version = "0.28", features = ["v1_32"] }

# GCP GKE authentication
gcp_auth = "0.12"

# Azure AKS authentication
# Without their default `reqwest_rustls`, which pulls reqwest with aws-lc-rs;
# reqwest's TLS comes from the dependency below, on the ring provider.
azure_identity = { version = "1.0", default-features = false }
azure_core = { version = "1.0", default-features = false, features = ["reqwest", "reqwest_deflate", "reqwest_gzip", "tokio"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_yaml = "0.9"

# HTTP client
# rustls on the process-wide ring provider and the platform verifier: one TLS
# stack for integrations, OIDC and share, instead of OpenSSL/SChannel beside
# a rustls nothing used.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "stream", "rustls-no-provider", "charset", "http2", "system-proxy"] }

# Security
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2.2"
# The verifier reqwest would pick, built in `tls.rs` so it can be wrapped.
rustls-platform-verifier = "0.7"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
secrecy = "0.10"
# X.509 is parsed here and never in the webview: a certificate's facts are
# small, its bytes are not, and the private key beside it must never leave
# this process.
x509-parser = "0.18"

# Logging and tracing — the subscriber is initialised in k8s-gui-common.
tracing = "0.1"

# Common utilities
k8s-gui-common = { path = "../k8s-gui-common" }

# Error handling
thiserror = "2.0"

# Configuration
dirs = "6.0"
toml = "1.1"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
url = "2.5"
regex = "1.11"
parking_lot = "0.12"
dashmap = "6.1"
rand = "0.10"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io", "compat"] }
urlencoding = "2.1"
flate2 = "1.0"

# Cross-platform PTY for interactive auth-exec processes (kubelogin
# password prompts, etc.) — pipes are not enough when the tool calls
# `term.ReadPassword` / `getpass` which require isatty(stdin).
portable-pty = "0.9"

# Replacing a kubeconfig means writing beside it and renaming over the
# original, so a crash mid-write cannot leave somebody without one.
tempfile = "3"
tauri-plugin-notification = "2"
http = "1"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }


# kill(2) on a process group: the login-shell probe in `shell::env` has to
# take the profile's children down with the shell when the deadline passes.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

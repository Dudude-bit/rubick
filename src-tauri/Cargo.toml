[package]
name = "k8s-gui"
version = "4.3.0"
edition = "2021"
rust-version = "1.91"
authors = ["Rubick Team"]
description = "A minimalist Kubernetes GUI client inspired by Lens"
license = "GPL-3.0-or-later"

[lib]
name = "k8s_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The process name is what macOS prints in the dev app bar, where there is
# no bundle to spell "Rubick" over it. The crate keeps its name; only the
# binary wears the product's.
[[bin]]
name = "Rubick"
path = "src/main.rs"

[dependencies]
# Tauri
tauri = { version = "2.1", features = ["image-png", "devtools"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"

# Async runtime
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Kubernetes
kube = { version = "0.97", default-features = false, features = ["client", "config", "runtime", "ws", "oauth", "oidc", "rustls-tls", "gzip"] }
k8s-openapi = { version = "0.23", features = ["v1_31"] }

# GCP GKE authentication
gcp_auth = "0.12"

# Azure AKS authentication
azure_identity = "0.21"
azure_core = "0.21"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

# WebSocket for exec
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# Security
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.2"
secrecy = "0.10"
# X.509 is parsed here and never in the webview: a certificate's facts are
# small, its bytes are not, and the private key beside it must never leave
# this process.
x509-parser = "0.16"

# Logging and tracing — the subscriber is initialised in k8s-gui-common.
tracing = "0.1"

# Common utilities
k8s-gui-common = { path = "../k8s-gui-common" }

# Error handling
thiserror = "2.0"

# Configuration
dirs = "6.0"
toml = "0.8"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
url = "2.5"
regex = "1.11"
parking_lot = "0.12"
dashmap = "6.1"
once_cell = "1.20"
rand = "0.10"
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io", "compat"] }
urlencoding = "2.1"
flate2 = "1.0"

# Cross-platform PTY for interactive auth-exec processes (kubelogin
# password prompts, etc.) — pipes are not enough when the tool calls
# `term.ReadPassword` / `getpass` which require isatty(stdin).
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

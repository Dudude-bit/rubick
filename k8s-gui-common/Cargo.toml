[package]
name = "k8s-gui-common"
version = "4.7.2"
edition = "2021"
rust-version = "1.91"
authors = ["Rubick Team"]
description = "Common utilities shared between k8s-gui projects"
license = "GPL-3.0-or-later"

[dependencies]
# Logging and tracing
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"


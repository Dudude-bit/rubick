[package]
name = "k8s-gui-common"
version = "4.17.0"
edition = "2021"
rust-version = "1.91"
authors = ["Rubick Team"]
description = "Common utilities shared between k8s-gui projects"
license = "GPL-3.0-or-later"

[dependencies]
# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
# The log file's directory, by each platform's own convention.
dirs = "7"

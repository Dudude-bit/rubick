# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# Правила проекта живут в CLAUDE.md и CONTRIBUTING.md; здесь только то, что
# ревьюеру нужно знать заранее, потому что по диффу это не видно.
language: "ru-RU"
tone_instructions: "Отвечай коротко и по делу, без похвал и вступлений. Пиши, что сломается и у кого, а не как лучше оформить."
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
    ignore_usernames:
      - "dependabot[bot]"

  path_filters:
    - "!src/generated/**"
    - "!dist/**"
    - "!target/**"
    - "!node_modules/**"
    - "!bun.lock"
    - "!Cargo.lock"
    - "!web/**"
    - "!**/__fixtures__/**"
    - "!**/*.snap"

  path_instructions:
    - path: "**/*.{ts,tsx,rs}"
      instructions: >-
        Главный класс дефектов здесь — третье состояние, схлопнутое во второе:
        «да / нет / не смогли посмотреть», нарисованное как «да / нет».
        Отказ в чтении, отданный пустой коллекцией или значением по умолчанию,
        превращается в «этого нет» — это дефект, даже если код компилируется.
        Поле, про которое можно не знать, по умолчанию должно быть неизвестным,
        а не известным. Тип, сводящий вердикт к строке или бейджу, обязан нести
        бит «знаем ли» рядом с самим вердиктом, и ветвление по нему должно
        выбирать не только слово, но и цвет.

        Второй класс: один факт читают несколько мест. Если правка меняет то,
        как читается факт из кластера, ищи остальных читателей — страница и
        бейдж в сайдбаре, страница и peek-панель, список и карточка. Правка в
        одном месте при трёх других — типичный здешний баг.
    - path: "src/**/*.{ts,tsx}"
      instructions: >-
        Бэкенд зовут только через `commands` из `@/lib/commands` — не через
        `@/generated/commands` и не через `invoke`. Опрос по таймеру — только
        `useLiveQuery({ refresh: "<rate>" })`; руками написанный
        `refetchInterval` запрещён линтом. Результат запроса React Query нельзя
        разворачивать спредом (`{...q}`) — это выключает пер-полевой трекинг
        рендеров. Рендереры колонок TanStack создаются один раз, на уровне
        модуля или в мемоизированном массиве колонок. Цвета — только
        роль-токены (`bg-canvas`, `text-fg-mut`, `text-ok`, `border-hair`),
        никаких сырых цветов Tailwind и `dark:`. `<select>` берётся из
        `components/ui`. Вне `src/integrations/` вендор по имени не
        упоминают — спрашивают фасет.
    - path: "src-tauri/**/*.rs"
      instructions: >-
        Новая `#[tauri::command]` обязана попасть в `generate_handler!` в
        `main.rs` — иначе биндинг сгенерируется, соберётся и упадёт в рантайме.
        Команда, которая что-то спавнит, должна быть `async`. Имена из фронта
        валидируются `validate_dns_label` / `validate_dns_subdomain`. Внешние
        бинари запускаются через `crate::shell::ShellCommand`. Текст
        `Error::CredentialsExpired` трогать нельзя: префикс
        `CREDENTIALS_EXPIRED:` — это формат провода. Внутри долгой задачи
        клиент берут из `state.client_manager` на каждую попытку.
    - path: "src/i18n/**"
      instructions: >-
        `catalogue.ts` и `ru.ts` должны совпадать по множеству ключей в обе
        стороны. Секция, добавленная в один файл и забытая в другом, молчит:
        ни один тест и ни один линт этого не ловят. Счётчики пишутся через
        объект множественного числа (в русском три формы), а не
        конкатенацией. Имена видов, статусы, типы условий, поля API и всё, что
        написал кластер, не переводятся.
    - path: "**/*.test.{ts,tsx}"
      instructions: >-
        Тест «не найдено» не должен проходить при ответе «не смогли
        посмотреть»: проверка на пустой список байт в байт совпадает с
        проглоченным 403. У каждой новой ветки `blind` / `NotChecked` /
        `*Known` должен быть тест, падающий при её удалении. Снапшотов здесь
        нет — утверждают поведение, а не разметку. Имя теста — предложение о
        поведении, без `should`.

chat:
  auto_reply: true
  art: false

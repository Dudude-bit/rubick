# Audit, Upgrade: Helm releases stored the way Helm 3 stores them.
# Apply after audit.yaml (it makes the namespace): kubectl apply -f tests/manifests/audit-upgrade.yaml
# Clean up: kubectl -n audit-test delete secret -l owner=helm
#
# legacy-web, deployed: its stored manifest names extensions/v1beta1 Ingress
# (gone in 1.22), policy/v1beta1 PodDisruptionBudget (gone in 1.25) and a
# Widget whose group no cluster serves. Audit: High, with the plugin to map it.
# moved-on: revision 1 (superseded) named networking.k8s.io/v1beta1, revision
# 2 (deployed) does not. Helm upgrades from revision 2, so Audit finds nothing.
# Generated; the release blobs are base64 of gzip of the release JSON.
apiVersion: v1
kind: Secret
type: helm.sh/release.v1
metadata:
  name: sh.helm.release.v1.legacy-web.v1
  namespace: audit-test
  labels:
    owner: helm
    name: legacy-web
    status: deployed
    version: "1"
stringData:
  release: 
---
apiVersion: v1
kind: Secret
type: helm.sh/release.v1
metadata:
  name: sh.helm.release.v1.moved-on.v1
  namespace: audit-test
  labels:
    owner: helm
    name: moved-on
    status: superseded
    version: "1"
stringData:
  release: 
---
apiVersion: v1
kind: Secret
type: helm.sh/release.v1
metadata:
  name: sh.helm.release.v1.moved-on.v2
  namespace: audit-test
  labels:
    owner: helm
    name: moved-on
    status: deployed
    version: "2"
stringData:
  release: 

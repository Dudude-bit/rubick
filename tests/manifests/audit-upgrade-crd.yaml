# Audit, Upgrade: a custom resource version its CRD marks deprecated.
# kubectl apply -f tests/manifests/audit.yaml -f tests/manifests/audit-upgrade-crd.yaml
# Audit says Low, quoting the CRD's warning. For Medium, say objects may
# still be stored at v1alpha1, as a CRD whose storage version moved would:
#   kubectl patch crd crontabs.audit.example.com --subresource=status --type=merge \
#     -p '{"status":{"storedVersions":["v1alpha1","v1"]}}'
# Applying the CronTab below asks the API server for the deprecated version,
# which a Prometheus scraping it may count in apiserver_requested_deprecated_apis.
# The CronTab needs the CRD established first: if kubectl says it has no
# such kind, apply the file again.
# Clean up: kubectl delete crd crontabs.audit.example.com
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: crontabs.audit.example.com
spec:
  group: audit.example.com
  scope: Namespaced
  names:
    plural: crontabs
    singular: crontab
    kind: CronTab
  versions:
    - name: v1alpha1
      served: true
      storage: false
      deprecated: true
      deprecationWarning: "audit.example.com/v1alpha1 CronTab is deprecated; use audit.example.com/v1 CronTab"
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: audit.example.com/v1alpha1
kind: CronTab
metadata:
  name: nightly
  namespace: audit-test
spec:
  schedule: "0 3 * * *"
